name: Workspace scoped acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: workspace-sync
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.repository == 'YSsolo/viaglyph-workspace-app' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7bbe1ae1d8405c989b12142e44a2b1a92b5968dd
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm --prefix functions ci
      - name: Verify pinned worker before authenticating
        run: node --test tests/sync-record-target.test.cjs tests/actions-scope.test.cjs tests/actions-secrets.test.cjs tests/sync-error-redaction.test.cjs tests/sync-revision.test.cjs tests/worker-wif-runtime.test.cjs
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Reconcile only the recorded acceptance Project
        env:
          WORKSPACE_DATABASE_URL: https://viaglyph-workspace-default-rtdb.firebaseio.com
          WORKSPACE_SYNC_PROJECT_ID: b819c1c6-d932-44ae-9677-6329faf96a16
          WORKSPACE_SEND_DIGEST: 'false'
          GITHUB_TOKEN_YSSOLO: ${{ secrets.WORKSPACE_GH_PAT_YSSOLO }}
        run: node scripts/actions-sync.cjs
